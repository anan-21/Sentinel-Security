name: Sentinel checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: node --test tests/test_guard.mjs
      - run: python -m pip install --no-deps .
      - run: sentinel-security install workbuddy --skills-root "$RUNNER_TEMP/skills"
      - run: docker build --tag sentinel-check .
      - name: Check container health and authentication
        shell: bash
        run: |
          set -eu
          export SENTINEL_TOKEN=$(openssl rand -hex 32)
          docker run -d --rm --name sentinel-check -p 127.0.0.1:18080:8000 -e SENTINEL_TOKEN sentinel-check
          trap 'docker stop sentinel-check >/dev/null' EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:18080/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:18080/mcp)" = 401
