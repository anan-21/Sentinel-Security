[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinel-agent-security"
version = "0.2.0"
description = "Read-only connector discovery and static security checks for personal agents"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "uvicorn==0.54.0"]
license = "MIT"
readme = "README.md"

[project.scripts]
sentinel-security = "sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["security", "server", "sentinel"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "sentinel/SKILL.md"
